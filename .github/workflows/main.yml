name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read            # the workflow can read the repo, nothing else

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # The repo holds ONE file (gkhata-source.zip) - unpack it here, then build as usual
      - name: Unpack gkhata-source.zip
        run: |
          unzip -q -o gkhata-source.zip
          ls

      - name: Fix paste (captureInput off)
        run: |
          sed -i 's/"captureInput": true/"captureInput": false/' capacitor.config.json
          grep captureInput capacitor.config.json

      - name: Fix MainActivity (onResume/onPause must be public)
        run: sed -i 's/@Override protected void onResume()/@Override public void onResume()/; s/@Override protected void onPause()/@Override public void onPause()/' native/MainActivity.java

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Create Android project and copy native code
        run: bash setup.sh

      # ---------- SIGNED RELEASE (when the 3 secrets exist) ----------
      - name: Build release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Align + sign + verify
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*-release-unsigned.apk)
          "$BT/zipalign" -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias dairy \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS --min-sdk-version 24 \
            --out dairy-order-release.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          "$BT/apksigner" verify --verbose --print-certs dairy-order-release.apk | tee verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt
          sha256sum dairy-order-release.apk | tee dairy-order-release.apk.sha256

      - name: Upload signed APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dairy-order-release
          path: |
            dairy-order-release.apk
            dairy-order-release.apk.sha256
          retention-days: 30

      # ---------- DEBUG FALLBACK (no secrets yet) ----------
      - name: Build debug APK (no keystore secrets set - NOT for daily use)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        if: env.HAS_KEYSTORE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dairy-order-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          

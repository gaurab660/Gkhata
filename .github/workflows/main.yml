# ============================================================
#  GKhata - Android APK build
#  Place this file at:  .github/workflows/build-apk.yml
#
#  Repo layout this workflow expects (matches your repo):
#    native/            *.java, AndroidManifest.xml, res/ (icons, splash, xml)
#    www/               index.html (the app UI)
#    tools/             make-icons.py, make-keystore.sh, out/ ...
#    setup.sh  package.json  package-lock.json  capacitor.config.json
#    gkhata-source.zip  (optional backup source; real folders win over the zip)
#    update*.zip        (optional later changes, applied in name order)
#    index.html / *.java / AndroidManifest.xml in repo root
#        -> copied into www/ and native/ automatically
#    version.txt        (optional) one line MAJOR.MINOR, e.g. 1.0  -> APK version 1.0.<build number>
#
#  Secrets (optional): KEYSTORE_B64, KS_PASS, KEY_PASS, KEY_ALIAS (default "dairy")
#      -> signed RELEASE apk.  Without them a DEBUG apk is built.
#  Variable (optional): VERSION_CODE_BASE
#
#  Output: Releases page (APK + .sha256) and Actions > run > Artifacts.
#  The run Summary page shows version, size, SHA-256, certificate,
#  permissions and, on failure, the error lines.
# ============================================================
name: Build Android APK

on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      version:
        description: Version name override (e.g. 1.0.2)
        required: false
        default: ''
      notes:
        description: Release notes (optional)
        required: false
        default: ''
      release_mode:
        description: "Releases page: versioned = keep every build (default), latest = one replaced release, none = Artifacts only"
        type: choice
        options: [versioned, latest, none]
        default: versioned
      smoke_test:
        description: Run on an Android emulator (launch, incoming call, SMS - crash check)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_B64 != '' }}
      BUILD_TYPE: ${{ secrets.KEYSTORE_B64 != '' && 'release' || 'debug' }}
    steps:
      - uses: actions/checkout@v6

      # ---------- 1. Source ----------
      - name: Prepare source (repo folders + optional zips)
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/stage"; mkdir -p "$STAGE"
          : > "$RUNNER_TEMP/applied.txt"
          unpack() {
            local z="$1" dir
            unzip -tq "$z" >/dev/null || { echo "::error::$z is damaged or not a zip - upload it again"; exit 1; }
            dir=$(mktemp -d -p "$RUNNER_TEMP")
            unzip -q -o "$z" -d "$dir"
            rm -rf "$dir/__MACOSX"; find "$dir" -name .DS_Store -delete
            set -- "$dir"/*
            if [ $# -eq 1 ] && [ -d "$1" ]; then
              case "$(basename "$1")" in
                www|native|tools|android) ;;
                *) echo "  $z: wrapper folder $(basename "$1")/ removed"; dir="$1" ;;
              esac
            fi
            cp -a "$dir"/. "$STAGE"/
            echo "$z" >> "$RUNNER_TEMP/applied.txt"
          }
          if [ -f gkhata-source.zip ]; then unpack gkhata-source.zip; echo "base: gkhata-source.zip"; fi
          for z in $(ls update*.zip 2>/dev/null | sort -V); do unpack "$z"; echo "update: $z"; done
          # real files in the repo win over files from zips
          cp -a --update=none "$STAGE"/. . || true
          mkdir -p www native
          if [ -f index.html ]; then cp -f index.html www/index.html; echo "index.html -> www/"; fi
          for f in *.java; do if [ -f "$f" ]; then cp -f "$f" native/; echo "$f -> native/"; fi; done
          if [ -f AndroidManifest.xml ]; then cp -f AndroidManifest.xml native/AndroidManifest.xml; echo "AndroidManifest.xml -> native/"; fi
          MISSING=""
          for need in setup.sh package.json capacitor.config.json www/index.html native/MainActivity.java native/AndroidManifest.xml; do
            [ -f "$need" ] || MISSING="$MISSING $need"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing:$MISSING  ->  upload the whole project (or gkhata-source.zip) to the repo root"
            {
              echo "## Source files missing"
              for m in $MISSING; do echo "- \`$m\`"; done
              echo
              echo "**Fix:** upload the missing files (or the whole \`gkhata-source.zip\`) to the repository root, then run again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "### Project files found"
            echo "- Java files in native/: $(ls native/*.java 2>/dev/null | wc -l)"
            echo "- Icons/resources in native/res: $(find native/res -type f 2>/dev/null | wc -l)"
            echo "- www/ files: $(find www -type f 2>/dev/null | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
          [ -f native/res/mipmap-xxxhdpi/ic_launcher.png ] || echo "::warning::native/res/mipmap-xxxhdpi/ic_launcher.png missing - the app may get the default icon"

      - name: Safety patches (harmless if already fixed)
        run: |
          set -e
          sed -i 's/"captureInput": true/"captureInput": false/' capacitor.config.json
          sed -i 's/@Override protected void onResume()/@Override public void onResume()/; s/@Override protected void onPause()/@Override public void onPause()/' native/MainActivity.java

      # ---------- 2. Version ----------
      - name: Version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          VC_BASE: ${{ vars.VERSION_CODE_BASE }}
        run: |
          set -euo pipefail
          # versionName = MAJOR.MINOR (from version.txt, else package.json) + "." + build number
          #   e.g. version.txt "1.0" -> 1.0.57 on build #57. Every push gets a higher version automatically.
          # To start a new series (2.0.x) just edit version.txt. A manual run can still override with "version".
          if [ -n "$INPUT_VERSION" ]; then VN="$INPUT_VERSION"
          else
            if [ -f version.txt ]; then BASE=$(cat version.txt); else BASE=$(node -p "require('./package.json').version"); fi
            BASE=$(printf '%s' "$BASE" | tr -d ' \r\n')
            BASE=$(printf '%s' "$BASE" | cut -d. -f1,2)
            VN="${BASE}.${{ github.run_number }}"
          fi
          VN=$(printf '%s' "$VN" | tr -d ' \r\n')
          [[ "$VN" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,30}$ ]] || { echo "::error::Bad version '$VN' (letters, digits, . _ - only)"; exit 1; }
          case "$VC_BASE" in ''|*[!0-9]*) VC_BASE=0 ;; esac
          VC=$((VC_BASE + ${{ github.run_number }}))
          echo "name=$VN" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "Version: $VN  (versionCode $VC)"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # ---------- 3. Fast checks ----------
      - name: Pre-build checks (fail in seconds instead of after the Gradle build)
        run: |
          set -euo pipefail
          node - <<'EOF'
          const fs = require('fs'), vm = require('vm');
          const html = fs.readFileSync('www/index.html', 'utf8');
          const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
          let m, n = 0, bad = 0;
          while ((m = re.exec(html))) {
            if (/\bsrc\s*=/.test(m[1])) continue;
            const t = (m[1].match(/\btype\s*=\s*["']?([^"'\s>]+)/i) || [])[1];
            if (t && !/^(text|application)\/(javascript|ecmascript)$/i.test(t)) continue;
            n++;
            try { new vm.Script(m[2], { filename: 'inline-script-' + n }); }
            catch (e) { bad++; console.log('::error::JS syntax error in www/index.html: ' + String(e.stack).split('\n').slice(0, 4).join(' | ')); }
          }
          console.log(n + ' inline scripts checked');
          if (bad) process.exit(1);
          EOF
          python3 - <<'EOF'
          import os, re, sys, xml.etree.ElementTree as ET
          A = '{http://schemas.android.com/apk/res/android}'
          bad = []
          try:
              root = ET.parse('native/AndroidManifest.xml').getroot()
              for e in root.iter():
                  if e.tag in ('activity', 'receiver', 'service', 'provider'):
                      n = e.get(A + 'name', '')
                      if n.startswith('.') or n.startswith('com.dairy.orderapp.'):
                          if not os.path.exists('native/%s.java' % n.split('.')[-1]):
                              bad.append('manifest class without .java file: ' + n)
              for c in re.findall(r'registerPlugin\((\w+)\.class\)', open('native/MainActivity.java').read()):
                  if not os.path.exists('native/%s.java' % c):
                      bad.append('registerPlugin class without .java file: ' + c)
              for d, _, fs in os.walk('native/res'):
                  for f in fs:
                      if f.endswith('.xml'):
                          ET.parse(os.path.join(d, f))
          except ET.ParseError as e:
              bad.append('XML error: %s' % e)
          for b in bad:
              print('::error::' + b)
          sys.exit(1 if bad else 0)
          EOF
          grep -q 'Content-Security-Policy' www/index.html || echo "::warning::www/index.html has no Content-Security-Policy tag"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Keep the debug signature stable between builds
        if: env.HAS_KEYSTORE != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      # ---------- 4. Create Android project ----------
      - name: Create Android project and copy native code
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -euo pipefail
          rm -rf android   # setup.sh runs "npx cap add android", which fails if android/ already exists
          bash setup.sh
          [ -d android ] || { echo "::error::setup.sh finished but android/ was not created - check setup.sh"; exit 1; }
          [ -f android/gradlew ] || { echo "::error::android/gradlew not found - setup.sh did not create a Gradle project"; exit 1; }

      # IMPORTANT: runs AFTER android/ exists (this fixes "No file matched [**/*.gradle*...]")
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # ---------- 5. Build ----------
      - name: Build APK
        working-directory: android
        timeout-minutes: 30
        run: |
          chmod +x gradlew
          if [ "$HAS_KEYSTORE" = "true" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          set -o pipefail
          ./gradlew $TASK --no-daemon --console=plain -Dorg.gradle.parallel=true 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show errors on the Summary page
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          {
            echo "## Build failed - error lines"
            echo '```'
            grep -n -E "error:|warning: \[|What went wrong|FAILED|Could not|Execution failed|cannot find symbol" -A4 build.log | head -80 || true
            echo '```'
            echo "(last 40 lines of log)"
            echo '```'
            tail -40 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------- 6. Sign ----------
      - name: Sign release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'dairy' }}
          VN: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          JKS="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$JKS"' EXIT
          echo "$KEYSTORE_B64" | base64 -d > "$JKS"
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*-release-unsigned.apk)
          "$BT/zipalign" -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/zipalign" -c -p 4 "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$JKS" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS --min-sdk-version 24 \
            --out "GKhata-$VN-release.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "GKhata-$VN-release.apk" | tee verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt

      - name: Name debug APK
        if: env.HAS_KEYSTORE != 'true'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "GKhata-${{ steps.ver.outputs.name }}-debug.apk"

      # ---------- 7. Inspect + summary ----------
      - name: Inspect APK and write summary
        env:
          VN: ${{ steps.ver.outputs.name }}
          VC: ${{ steps.ver.outputs.code }}
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK="GKhata-$VN-$BUILD_TYPE.apk"
          APP_ID=$(node -p "require('./capacitor.config.json').appId")
          "$BT/aapt2" dump badging "$APK" > badging.txt
          grep -q "^package: name='$APP_ID' versionCode='$VC' versionName='$VN'" badging.txt \
            || { echo "::error::APK does not match expected $APP_ID $VN ($VC)"; head -1 badging.txt; exit 1; }
          unzip -p "$APK" assets/public/index.html | cmp -s - www/index.html \
            || echo "::warning::index.html inside the APK differs from www/index.html"
          grep -oP "uses-permission: name='\K[^']+" badging.txt | sort -u > perms.txt
          MIN=$(grep -oP "^sdkVersion:'\K[0-9]+" badging.txt || echo "?")
          TGT=$(grep -oP "^targetSdkVersion:'\K[0-9]+" badging.txt || echo "?")
          "$BT/apksigner" verify --print-certs "$APK" > certs.txt 2>&1 || true
          CERT=$(grep -m1 -oP 'certificate SHA-256 digest: \K\w+' certs.txt || echo "?")
          sha256sum "$APK" | tee "$APK.sha256"
          SHA=$(cut -d' ' -f1 "$APK.sha256")
          SIZE=$(du -h "$APK" | cut -f1)
          {
            echo "## GKhata $VN ($BUILD_TYPE) - build #${{ github.run_number }}"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| File | \`$APK\` ($SIZE) |"
            echo "| versionCode | $VC |"
            echo "| Android | min SDK $MIN, target SDK $TGT |"
            echo "| SHA-256 | \`$SHA\` |"
            echo "| Signing certificate | \`$CERT\` |"
            echo "| Source zips used | $(tr '\n' ' ' < "$RUNNER_TEMP/applied.txt") |"
            echo
            echo "The signing certificate must be identical in every build, otherwise Android refuses the update."
            if [ "$BUILD_TYPE" = debug ]; then
              echo
              echo "**Debug build** - not for daily use. If the certificate differs from the installed app, take a Backup first, then uninstall and install again."
            fi
            echo
            echo "<details><summary>Permissions ($(wc -l < perms.txt))</summary>"
            echo
            sed 's/^/- /' perms.txt
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            if [ -n "$INPUT_NOTES" ]; then printf '%s\n\n' "$INPUT_NOTES"; fi
            echo "Build #${{ github.run_number }} - $(date -u '+%F %H:%M') UTC - $(git log -1 --pretty='%h %s')"
            echo
            echo "- Type: $BUILD_TYPE, versionCode $VC, Android min $MIN / target $TGT"
            echo "- SHA-256: $SHA"
            echo "- Signing certificate: $CERT"
          } > release-notes.md

      # ---------- 8. Publish ----------
      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v7
        with:
          name: GKhata-${{ steps.ver.outputs.name }}-${{ env.BUILD_TYPE }}
          path: GKhata-*.apk*
          if-no-files-found: error
          retention-days: ${{ env.HAS_KEYSTORE == 'true' && 90 || 14 }}

      - name: Publish on Releases page (direct .apk link)
        if: inputs.release_mode != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ inputs.release_mode }}
          VN: ${{ steps.ver.outputs.name }}
        run: |
          # Every build = its own normal (non-pre-release) release, newest one marked "Latest".
          # Besides GKhata-<version>-<type>.apk, a fixed-name GKhata.apk is attached, so this link never changes:
          #   https://github.com/<owner>/<repo>/releases/latest/download/GKhata.apk
          mkdir -p "$RUNNER_TEMP/rel"
          cp GKhata-*.apk* "$RUNNER_TEMP/rel/"
          cp "GKhata-$VN-$BUILD_TYPE.apk" "$RUNNER_TEMP/rel/GKhata.apk"
          if [ "${MODE:-versioned}" = "latest" ]; then
            TAG="latest"
          else
            TAG="v${VN}"
          fi
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true   # remove the old single "latest" pre-release, if any
          if gh release create "$TAG" "$RUNNER_TEMP"/rel/* --target "$GITHUB_SHA" --latest \
              --title "GKhata $VN" \
              --notes-file release-notes.md; then
            printf '\n**Download:** %s/%s/releases/tag/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" >> "$GITHUB_STEP_SUMMARY"
            printf '\n**Permanent APK link:** %s/%s/releases/latest/download/GKhata.apk\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Could not publish on the Releases page - check Settings > Actions > General > Workflow permissions = Read and write"
            exit 1
          fi

      # ---------- 9. Optional emulator smoke test ----------
      - name: Enable KVM
        if: inputs.smoke_test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write smoke test script
        if: inputs.smoke_test
        run: |
          cat > smoke.sh <<'EOF'
          set -u
          PKG=com.dairy.orderapp
          APK=$(ls GKhata-*.apk | head -1)
          mkdir -p smoke
          adb install -r "$APK" || exit 1
          for p in READ_PHONE_STATE READ_CALL_LOG RECEIVE_SMS READ_CONTACTS POST_NOTIFICATIONS RECORD_AUDIO; do
            adb shell pm grant "$PKG" "android.permission.$p" >/dev/null 2>&1
          done
          adb logcat -c
          adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1
          sleep 20
          adb shell pidof "$PKG" >/dev/null || { echo "::error::App is not running after launch"; adb logcat -d > smoke/logcat.txt; exit 1; }
          adb emu gsm call 9841000000; sleep 4
          adb emu gsm cancel 9841000000; sleep 4
          adb emu sms send 9841000000 "dahi 2 poka"; sleep 4
          adb shell screencap -p /sdcard/screen.png && adb pull /sdcard/screen.png smoke/screen.png
          adb logcat -d > smoke/logcat.txt
          if grep -qE "Process: $PKG|ANR in $PKG" smoke/logcat.txt; then echo "::error::App crashed - see the smoke-test artifact (logcat.txt)"; exit 1; fi
          adb shell pidof "$PKG" >/dev/null || { echo "::error::App stopped after incoming call/SMS"; exit 1; }
          echo "Smoke test passed"
          EOF

      - name: Emulator smoke test
        if: inputs.smoke_test
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash smoke.sh

      - name: Upload smoke test files
        if: always() && inputs.smoke_test
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test
          path: smoke/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
          
